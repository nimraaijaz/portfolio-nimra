<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nimra Aijaz logo">
  <defs>
    <linearGradient id="logoGradient" x1="8" y1="8" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="letterGradient" x1="30" y1="28" x2="70" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e6f1ff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <!-- Hexagon "circuit node" frame -->
  <path
    d="M50 4 L90 27 V73 L50 96 L10 73 V27 Z"
    fill="#07111F"
    stroke="url(#logoGradient)"
    stroke-width="3"
  />

  <!-- Circuit corner nodes -->
  <circle cx="50" cy="4" r="3" fill="#38bdf8"/>
  <circle cx="90" cy="27" r="3" fill="#2dd4bf"/>
  <circle cx="90" cy="73" r="3" fill="#2dd4bf"/>
  <circle cx="50" cy="96" r="3" fill="#a78bfa"/>
  <circle cx="10" cy="73" r="3" fill="#a78bfa"/>
  <circle cx="10" cy="27" r="3" fill="#38bdf8"/>

  <!-- "N" monogram, built from straight strokes to read as circuit traces -->
  <path
    d="M32 68 V32 L68 68 V32"
    stroke="url(#letterGradient)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Small accent node at the letter's pivot, echoing a circuit junction -->
  <circle cx="50" cy="50" r="2.5" fill="#38bdf8"/>
</svg>